<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elsword Trainer</title>
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<style>
  :root {
    --bg:#0F1115; --panel:#171A20; --line:#2A2F37; --fg:#E9EBEE; --muted:#9AA1AC;
    --accent:#4C8DFF; --hi:#7AABFF; --on-accent:#08162E; --ok:#4CC38A; --red:#FF6B70; --warn:#F2B84B;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  * { box-sizing:border-box; }
  html { color-scheme:dark; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px;
         background:var(--bg); color:var(--fg); font:16px/1.5 "Segoe UI", system-ui, sans-serif; }
  ::selection { background:var(--accent); color:var(--on-accent); }
  main { width:100%; max-width:440px; }
  h1 { margin:0; font-size:28px; line-height:1.15; font-weight:650; letter-spacing:-.01em; text-wrap:balance; }
  .ver { margin:8px 0 0; min-height:24px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .ver.err { color:var(--red); }
  .skel { display:inline-block; width:150px; height:14px; border-radius:7px; background:var(--line); vertical-align:middle;
          animation:pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.4; } }

  #go { display:block; width:100%; min-height:56px; margin-top:24px; padding:0 20px; border:0; border-radius:10px;
        background:var(--accent); color:var(--on-accent); font:inherit; font-size:18px; font-weight:700; cursor:pointer;
        transition:background .15s, transform .15s var(--ease); }
  #go:hover:not(:disabled) { background:var(--hi); }
  #go:active:not(:disabled) { transform:scale(.985); }
  #go:disabled { background:var(--line); color:var(--muted); cursor:default; }
  #go.done { background:transparent; color:var(--fg); box-shadow:inset 0 0 0 1px var(--line); }
  #go.done:hover { background:var(--panel); }
  :focus-visible { outline:2px solid var(--hi); outline-offset:3px; }

  .bar { height:8px; margin-top:12px; background:var(--panel); border-radius:4px; overflow:hidden; opacity:0; transition:opacity .2s; }
  .bar.on { opacity:1; }
  .bar > div { height:100%; width:0; background:var(--accent); border-radius:4px; transition:width .15s linear; }
  .bar.ok > div { background:var(--ok); }
  #msg { min-height:24px; margin:8px 0 0; font-size:14px; color:var(--muted); }
  #msg.err { color:var(--red); }
  #msg.ok { color:var(--ok); }
  #msg a { color:var(--hi); }

  ol { list-style:none; margin:28px 0 0; padding:0; display:grid; gap:12px; }
  li { display:grid; grid-template-columns:28px 1fr; gap:12px; align-items:start; color:var(--muted); transition:color .3s; }
  li b { color:var(--fg); font-weight:600; }
  li i { display:grid; place-items:center; width:28px; height:28px; border-radius:50%; box-shadow:inset 0 0 0 1px var(--line);
         font:600 13px/1 "Segoe UI", system-ui, sans-serif; font-style:normal; color:var(--muted); transition:all .3s; }
  li.now { color:var(--fg); }
  li.now i { background:var(--accent); color:var(--on-accent); box-shadow:none; }
  li.fin i { background:var(--ok); color:var(--on-accent); box-shadow:none; }

  .note { margin:24px 0 0; padding:12px 14px; border-radius:8px; background:var(--panel); box-shadow:inset 0 0 0 1px var(--line);
          font-size:14px; color:var(--muted); }
  .note b { color:var(--warn); font-weight:600; }
  .foot { margin:16px 0 0; font-size:13px; color:var(--muted); }

  @media (prefers-reduced-motion:reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<main>
  <h1>Elsword Trainer</h1>
  <p class="ver" id="ver" aria-live="polite"><span class="skel"></span></p>

  <button id="go" disabled>Baixar</button>
  <div class="bar" id="bar" role="progressbar" aria-label="Progresso do download" aria-valuemin="0" aria-valuemax="100"><div></div></div>
  <p id="msg" aria-live="polite"></p>

  <ol>
    <li id="s1" class="now"><i>1</i><span><b>Baixe</b> o .zip</span></li>
    <li id="s2"><i>2</i><span><b>Extraia</b> a pasta inteira (botão direito → Extrair tudo)</span></li>
    <li id="s3"><i>3</i><span><b>Abra</b> ElswordTrainer.exe e entre com sua conta</span></li>
  </ol>

  <p class="note"><b>Windows avisou?</b> Clique em “Mais informações” → “Executar assim mesmo”. É normal em programas novos.</p>
  <p class="foot">Depois do primeiro uso ele se atualiza sozinho.</p>
</main>
<script>
  // Login server = Supabase Edge Function; /baixar redirects to the zip in the public Storage bucket.
  const SERVER = "https://tcouqlxwszlcxsesnttk.supabase.co/functions/v1/trainer";
  const $ = (id) => document.getElementById(id);
  let info = null;
  const step = (n) => ["s1", "s2", "s3"].forEach((id, i) => { $(id).className = i + 1 < n ? "fin" : i + 1 === n ? "now" : ""; });
  const say = (t, cls = "") => { $("msg").className = cls; $("msg").textContent = t; };

  fetch(SERVER + "/versao")
    .then((r) => r.json())
    .then((d) => {
      info = d;
      if (!d.version) { $("ver").textContent = "Nenhuma versão publicada ainda."; return; }
      $("ver").textContent = `Versão ${d.version} · ${(d.size / 1048576).toFixed(1)} MB · Windows`;
      $("go").disabled = false;
    })
    .catch(() => {
      $("ver").className = "ver err";
      $("ver").textContent = "Servidor fora do ar. Tente de novo em alguns minutos.";
    });

  $("go").onclick = async () => {
    const go = $("go"), bar = $("bar"), fill = bar.firstElementChild;
    go.disabled = true; go.className = ""; go.textContent = "Baixando…";
    bar.className = "bar on"; fill.style.width = "0"; say("");
    step(1);
    try {
      const r = await fetch(SERVER + "/baixar");
      if (!r.ok) throw new Error("HTTP " + r.status);
      const total = Number(r.headers.get("Content-Length")) || info.size || 0;
      const reader = r.body.getReader();
      const parts = []; let got = 0;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        parts.push(value); got += value.length;
        if (total) {
          const p = Math.min(100, 100 * got / total);
          fill.style.width = p.toFixed(1) + "%";
          bar.setAttribute("aria-valuenow", Math.round(p));
          go.textContent = `Baixando… ${Math.round(p)}%`;
        }
      }
      if (total && got !== total) throw new Error("download incompleto");
      const ver = r.headers.get("X-Trainer-Version") || info.version;
      const url = URL.createObjectURL(new Blob(parts, { type: "application/zip" }));
      const a = Object.assign(document.createElement("a"), { href: url, download: `ElswordTrainer-${ver}.zip` });
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      bar.className = "bar on ok";
      say("Pronto! O .zip está na pasta Downloads. Agora extraia e abra.", "ok");
      go.className = "done"; go.textContent = "Baixar de novo";
      step(2);
    } catch (e) {
      bar.className = "bar";
      say(`Falhou (${e.message}). `, "err");
      const l = Object.assign(document.createElement("a"), { href: SERVER + "/baixar", textContent: "Baixar direto" });
      $("msg").appendChild(l);
      go.textContent = "Tentar de novo";
    }
    go.disabled = false;
  };
</script>
</body>
</html>
